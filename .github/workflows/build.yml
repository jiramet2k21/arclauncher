name: Build

# Builds a signed release APK on every push to main (and on demand).
# Unlike release.yml this workflow needs no repository secrets: it generates a
# throwaway keystore so the produced APK can be installed directly on a device.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate signing keystore (fallback when not committed)
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            echo "Using committed upload-keystore.jks (stable signature between builds)"
          else
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass android -alias arclauncher -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Arc Launcher, OU=Development, O=Development, L=City, S=State, C=US"
          fi

      - run: flutter pub get

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: android
          SIGNING_KEY_ALIAS: arclauncher
          SIGNING_KEY_PASSWORD: android
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true
          mkdir -p release-apks
          find build/app/outputs -name '*.apk' -exec cp -t release-apks/ {} +

      - uses: actions/upload-artifact@v4
        with:
          name: arclauncher-slideshow
          path: release-apks/
          retention-days: 7
          if-no-files-found: error
