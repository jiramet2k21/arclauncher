# One-off workflow: generates the fixed throwaway keystore used for signed
# release APKs so that the same signing key is reused between builds.
# Run manually via: gh workflow run gen-keystore.yml
name: gen-keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storepass android -alias arclauncher -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Arc Launcher, OU=Development, O=Development, L=City, S=State, C=US"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
