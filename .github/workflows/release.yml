name: Release

# Builds the release APK set when a version tag is pushed (also on demand).
# Publishing the GitHub Release itself stays manual (`gh release create`) so the
# release notes keep their custom content — this workflow only produces the
# APKs to attach. No repository secrets needed: the signing keystore is
# committed at android/app/upload-keystore.jks (throwaway, see build.yml).
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify signing keystore
        run: |
          test -f android/app/upload-keystore.jks || {
            echo "Committed upload-keystore.jks is missing"; exit 1;
          }
      - run: flutter pub get
      - name: Build release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: android
          SIGNING_KEY_ALIAS: arclauncher
          SIGNING_KEY_PASSWORD: android
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="manual-${{ github.sha }}"
          fi
          # versionCode from pubspec.yaml (e.g. 1.0.10+4120 → 4120)
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          test -n "$BUILD_NUMBER" || {
            echo "Could not parse versionCode from pubspec.yaml"; exit 1;
          }
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number="${BUILD_NUMBER}" \
            --build-name="${TAG}"
          mkdir -p release-apks
          find build/app/outputs -name '*.apk' -exec cp -t release-apks/ {} +
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-apks/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
